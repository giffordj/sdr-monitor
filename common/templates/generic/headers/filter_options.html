<div class="dropdown">
    <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="Pick a value" aria-label="Pick a value"><i class="bi bi-list-ul"></i></button>
    <div class="dropdown-menu" onclick="event.stopPropagation()">
        {% for option in options %}
        <a class="dropdown-item d-flex align-items-center gap-2" href="#">
            <input class="form-check-input m-0" type="radio" name="{{ field }}_option" value="{{ option }}" id="input_{{ field }}_option_{{ forloop.counter }}" field-id="{{ field }}"
                onclick="var f=document.getElementById('{{ input_id }}'); if (f) { f.value = this.value; }"
                {% if form_id %}form="{{ form_id }}"{% endif %}>
            <span>{{ option }}</span>
        </a>
        {% endfor %}
    </div>
</div>
