# Overlay for the base image's /etc/logrotate.d/sdr.conf.
#
# Supervisor keeps every program's stdout/stderr in /var/log/sdr/ with
# stdout_logfile_maxbytes=0 (no internal rotation), so log growth is bounded
# only by logrotate. The upstream base rotates at 10M keeping 9 copies per file,
# which let a crash-looping scanner accumulate hundreds of MB. Rotate sooner and
# keep fewer copies so a runaway process can never fill the disk.
/var/log/sdr/*.log {
    rotate 3
    size 5M
    copytruncate
    missingok
    notifempty
}
